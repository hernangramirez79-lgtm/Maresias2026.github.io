<style>
/* Layout: una sola columna centrada; el contador es el héroe, el editor queda debajo, plegable. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #141a2b;
  --muted: #5d6680;
  --line: #d5dbe7;
  --accent: #2f5bea;
  --tile: #141a2b;
  --tile-ink: #f4f6fb;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121c; --surface: #171d2b; --ink: #eef1f8; --muted: #9aa3bb;
    --line: #2a3246; --accent: #7d9bff; --tile: #222a3d; --tile-ink: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121c; --surface: #171d2b; --ink: #eef1f8; --muted: #9aa3bb;
  --line: #2a3246; --accent: #7d9bff; --tile: #222a3d; --tile-ink: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
}

header .eyebrow, header h1, header .target { color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.toast { text-shadow: 0 1px 6px rgba(0,0,0,.5); }
/* Contador más abajo, para dejar ver la foto */
#clock, #done { margin-top: 3cm; }
/* Recuadros del contador semitransparentes */
.unit { background: rgba(14,18,28,.4); color: #fff; border: 1px solid rgba(255,255,255,.18); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.unit .num { text-shadow: 0 2px 10px rgba(0,0,0,.55); }
/* Fecha en la esquina superior izquierda, para no tapar el texto de la foto */
header .target {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px));
  margin: 0; font-size: 13px; font-weight: 600; max-width: calc(100% - 24px);
  background: rgba(10,14,24,.55); border-radius: 999px; padding: 6px 12px;
}
.unit { box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.phrase, .editor { box-shadow: 0 6px 20px rgba(0,0,0,.25); }
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 9vw, 60px); line-height: 1; margin: 6px 0 0; text-wrap: balance; text-transform: uppercase; }
.target { color: var(--muted); margin-top: 10px; }
.clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.clock .num { font-size: clamp(40px, 12vw, 84px); }
.clock .lbl { font-size: clamp(9px, 2.6vw, 12px); letter-spacing: .1em; }
.unit { background: var(--tile); color: var(--tile-ink); border-radius: 14px; padding: 18px 8px 14px; text-align: center; position: relative; overflow: hidden; }
.unit::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--bg); opacity: .35; }
.num { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 16vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; }
.lbl { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-top: 8px; }
.done { font-family: var(--display); font-weight: 800; font-size: 40px; text-align: center; color: var(--accent); text-transform: uppercase; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
button { font: 600 15px var(--body); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.toast { color: var(--accent); font-weight: 600; font-size: 14px; min-height: 1.2em; }
.editor { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.editor h2 { margin: 0; font-size: 16px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row { grid-template-columns: 1fr; } }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
input { font: 16px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; width: 100%; }
.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
.phrase { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid #f2a33a; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.phrase .pt { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 6.5vw, 36px); line-height: 1.1; color: var(--ink); }
.phrase .es { color: var(--muted); font-size: 15px; }
.phrase .actions { margin-top: 4px; }
.phrase .tag { align-self: flex-start; font-size: 12px; font-weight: 600; background: #f2a33a; color: #1b1300; border-radius: 999px; padding: 3px 10px; }
.phrase .count { font-size: 12px; color: var(--muted); }
.milestone { background: rgba(242,163,58,.95); color: #1b1300; font-weight: 700; font-size: 17px; border-radius: 14px; padding: 14px 18px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.pack { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.pack h2 { margin: 0; font-size: 18px; }
.pack .progress { font-size: 13px; color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: #2bb673; transition: width .3s; }
.pack ul { list-style: none; margin: 0; padding: 0; }
.pack li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.pack li:last-child { border-bottom: 0; }
.pack li label { flex: 1; flex-direction: row; align-items: center; gap: 12px; font-size: 15px; color: var(--ink); cursor: pointer; padding: 4px 0; }
.pack input[type=checkbox] { width: 20px; height: 20px; flex: none; margin: 0; accent-color: #2bb673; }
.pack li.ok label span { text-decoration: line-through; color: var(--muted); }
.pack .del { padding: 4px 10px; font-size: 13px; }
.pack .add { display: flex; gap: 8px; }
.pack .add input { flex: 1; }
.voice { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.voice select { font: 15px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tabs button { padding: 8px 4px; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button small { font-size: 11px; font-weight: 500; opacity: .75; }
.tabs button[aria-selected="true"] { background: #2bb673; border-color: #2bb673; color: #fff; }
.login { display: flex; flex-direction: column; gap: 10px; }
.loginMsg { margin: 0; font-size: 15px; line-height: 1.4; }
.loginErr { margin: 0; color: #e5484d; font-weight: 600; font-size: 14px; min-height: 1.2em; }
#packBody { display: flex; flex-direction: column; gap: 12px; }
.logout { align-self: flex-start; padding: 6px 12px; font-size: 13px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
textarea.fallback { width: 100%; font: 14px var(--body); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
</style>

<main>
  <header>
    <div class="eyebrow">Faltan</div>
    <h1 id="title">Maresias 🏖️</h1>
    <div class="target" id="target"></div>
  </header>

  <section class="clock" id="clock" aria-live="polite">
    <div class="unit"><div class="num" id="d">00</div><div class="lbl">Días</div></div>
    <div class="unit"><div class="num" id="h">00</div><div class="lbl">Horas</div></div>
    <div class="unit"><div class="num" id="m">00</div><div class="lbl">Minutos</div></div>
    <div class="unit"><div class="num" id="s">00</div><div class="lbl">Segundos</div></div>
  </section>
  <div class="done" id="done" hidden>¡Llegó el día!</div>
  <div class="milestone" id="milestone" hidden></div>

  <div>
    <p class="toast" id="toast"></p>
    <textarea class="fallback" id="fallback" rows="3" hidden readonly></textarea>

      var p = persona;
      if (loginFor !== p) { $("pw1").value = ""; $("pw2").value = ""; $("loginErr").textContent = ""; loginFor = p; }
      var paint = function () {
        var r = registrado[p];
        if (r === undefined) { $("loginMsg").textContent = "Cargando…"; $("pw2").hidden = true; return; }
        if (r) {
          $("loginMsg").textContent = "Usuario: " + p + ". Ingresá tu clave.";
          $("pw2").hidden = true; $("pw1").autocomplete = "current-password"; $("loginBtn").textContent = "Entrar";
        } else {
          $("loginMsg").textContent = "¡Hola " + p + "! Es tu primera vez: creá tu clave (mínimo 6 caracteres). Guardala, la vas a necesitar para volver a entrar.";
          $("pw2").hidden = false; $("pw1").autocomplete = "new-password"; $("loginBtn").textContent = "Crear clave y entrar";
        }
      };
      paint();
      if (registrado[p] === undefined) {
        sb.rpc("persona_registrada", { nombre: p }).then(function (res) {
          registrado[p] = res.error ? true : !!res.data;
          if (persona === p) paint();
        });
      }
    };
    $("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var p = persona, pw = $("pw1").value, err = $("loginErr");
      err.textContent = "";
      if (pw.length < 6) { err.textContent = "La clave tiene que tener al menos 6 caracteres."; return; }
      $("loginBtn").disabled = true;
      var fin = function () { $("loginBtn").disabled = false; };
      if (registrado[p]) {
        sb.auth.signInWithPassword({ email: emailDe(p), password: pw }).then(function (res) {
          fin();
          if (res.error) err.textContent = "Clave incorrecta. Probá de nuevo.";
        });
      } else {
        if (pw !== $("pw2").value) { fin(); err.textContent = "Las dos claves no coinciden."; return; }
        sb.auth.signUp({ email: emailDe(p), password: pw }).then(function (res) {
          fin();
          if (res.error) {
            if (/registered|exists/i.test(res.error.message)) { registrado[p] = true; showLogin(); err.textContent = p + " ya tiene clave. Ingresala."; }
            else err.textContent = "No se pudo crear la clave: " + res.error.message;
            return;
          }
          registrado[p] = true;
          if (!res.data || !res.data.session) err.textContent = "Clave creada, pero Supabase pide confirmar el email. Hay que desactivar \"Confirm email\" en Supabase.";
        });
      }
    });
    $("logout").addEventListener("click", function () { sb.auth.signOut(); });

    var setSession = function (session) {
      var n = session && session.user ? nombreDe(session.user.email) : null;
      if (n === me && allItems.length) return;
      me = n;
      if (me) { persona = me; try { localStorage.setItem(PERSONA_KEY, me); } catch (e) {} }
      $("logout").hidden = !me;
      $("logout").textContent = me ? "Cerrar sesión (" + me + ")" : "Cerrar sesión";
      loadShared();
    };
    sb.auth.onAuthStateChange(function (event, session) { setTimeout(function () { setSession(session); }, 0); });
    drawAll();
    sb.auth.getSession().then(function (res) { setSession(res.data && res.data.session); });

    try {
      sb.channel("valija-cambios")
        .on("postgres_changes", { event: "*", schema: "public", table: "valija" }, function () { loadShared(); })
        .subscribe();
    } catch (e) {}
    document.addEventListener("visibilitychange", function () { if (!document.hidden) loadShared(); });
  } else {
    // --- Modo local (solo este navegador) ---
    $("packMode").textContent = "📱 Estas bitácoras se guardan solo en este navegador.";
    var PACK_KEY = "maresias-bitacoras";
    var local = null;
    try { local = JSON.parse(localStorage.getItem(PACK_KEY) || "null"); } catch (e) {}
    if (!local || !Array.isArray(local.items)) {
      local = { next: 1, items: [] };
      PERSONAS.forEach(function (p) { PACK_DEFAULT.forEach(function (t) { local.items.push({ id: local.next++, persona: p, texto: t, listo: false, fijo: true }); }); });
    }
    allItems = local.items;
    var saveLocal = function () { local.items = allItems; try { localStorage.setItem(PACK_KEY, JSON.stringify(local)); } catch (e) {} };
    handlers.toggle = function () { saveLocal(); };
    handlers.remove = function () { saveLocal(); };
    handlers.add = function (t, p) { allItems.push({ id: local.next++, persona: p, texto: t, listo: false, fijo: false }); saveLocal(); drawAll(); };
    saveLocal();
    drawAll();
  }

  // Festejos: mensajes al mes, la semana y el día, y papel picado
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(ms) {
    if (reduceMotion || document.getElementById("confetti")) return;
    var c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c);
    var ctx = c.getContext("2d"), W, H;
    function size() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
    size(); window.addEventListener("resize", size);
    var colors = ["#f2a33a", "#2bb673", "#2f5bea", "#ffd23f", "#ff5d73", "#ffffff"];
    var parts = [];
    for (var i = 0; i < 160; i++) parts.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, vy: 2 + Math.random() * 3, vx: -1.5 + Math.random() * 3, r: Math.random() * 6.28, vr: -0.2 + Math.random() * 0.4, col: colors[i % colors.length] });
    var end = Date.now() + ms;
    (function tick() {
      ctx.clearRect(0, 0, W, H);
      var alive = false, more = Date.now() < end;
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if (more && p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
        if (p.y < H + 20) alive = true;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      if (alive) requestAnimationFrame(tick); else { window.removeEventListener("resize", size); c.remove(); }
    })();
  }
  var MILESTONES = {
    "30": "📅 ¡Falta un mes para Maresias! Empezá a mirar la valija.",
    "7": "🧳 ¡Falta una semana! Hora de armar la valija.",
    "1": "⏳ ¡Falta un día! Mañana a esta hora ya casi están.",
    "0": "🚗 ¡Menos de 24 horas! Ya huele a playa.",
    "done": "🎉 Boa viagem! ¡A disfrutar Maresias!"
  };
  var lastMilestone = null;
  function checkMilestone() {
    var r = remaining();
    var key = r.ms === 0 ? "done" : (MILESTONES[String(r.d)] ? String(r.d) : "");
    if (key === lastMilestone) return;
    var first = lastMilestone === null;
    lastMilestone = key;
    $("milestone").hidden = !key;
    $("milestone").textContent = key ? MILESTONES[key] : "";
    if (key) confetti(key === "done" ? 8000 : 4000);
  }
  setInterval(checkMilestone, 1000);
  if (location.hash === "#festejo") setTimeout(function () { confetti(5000); }, 300);

  window.addEventListener("hashchange", function () { readHash(); syncForm(); render(); });
  readHash(); syncForm(); render(); checkMilestone();
  setInterval(render, 1000);
})();
</script>

</body></html>
